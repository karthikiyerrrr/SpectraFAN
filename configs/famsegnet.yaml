# FAMSegNet: AtomSegNet U-Net with a FAM on each skip, E5 recipe.
# FAM presence is determined by model.name: "famsegnet" => fam_complex skips.

extends: adapted_recipe.yaml

model:
  name: famsegnet

train:
  # Same rationale as atomsegnet.yaml: AtomSegNet's high-res convs are slow under the
  # recipe's deterministic kernels, so enable cudnn.benchmark autotuning. Both sweep
  # arms flip together, keeping the FAM ablation clean; only bitwise repro is traded.
  deterministic: false
