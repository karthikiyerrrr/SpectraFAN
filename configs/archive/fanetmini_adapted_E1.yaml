# Adapted track E1: drop BatchNorm from the 1-channel output head.
# Hypothesis: BN on the final 1-channel logit corrupts calibration through
# noisy BS=4 batch statistics at train time and noisy running stats at eval.
#
# NOTE: extends default.yaml directly (not fanetmini.yaml). The config loader
# only resolves one level of `extends:`, so chaining through fanetmini.yaml
# silently drops default.yaml's overrides (specifically image_size: 256) in
# favor of the dataclass defaults (image_size: 512).

extends: ../default.yaml

model:
  name: fanetmini
  output_norm: none

train:
  epochs: 50
  amp: true            # match the baseline run (runs/2026-05-23_235101_fanetmini)
