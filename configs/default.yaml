# SpectraFAN default training config.
# Mirrors the paper's reported settings for the baseline reproduction.

model:
  channels: [64, 128, 256, 512]
  bottleneck: 1024                # standard U-Net bottleneck (depth-4 encoder + 1 bottleneck stage)
  fam_conv_kind: depthwise        # one of: depthwise | depthwise_separable; locked by params calibration vs Liu et al. 2026 Table 1

data:
  dataset: temimagenet
  root: data/raw/temimagenet
  image_size: 256              # native TEMImageNet resolution; upsampling to 512 wastes 4x compute for no information
  batch_size: 4
  subset_size: null            # null = full split
  val_subset_size: null
  splits_dir: data/splits/temimagenet_v1
  num_workers: 2

aug:
  p_flip: 0.5                  # applies independently to horizontal and vertical flip
  max_rot_deg: 15
  zoom_range: [0.9, 1.1]
  noise_sigma: 0.01

optim:
  optimizer: rmsprop
  lr: 1.0e-5
  decay: 0.99
  weight_decay: 1.0e-8
  momentum: 0.999

train:
  epochs: 200
  seed: 0
  device: auto                 # auto | cuda | mps | cpu
  run_root: runs
  loss:
    ce_weight: 0.5
    dice_weight: 0.5
