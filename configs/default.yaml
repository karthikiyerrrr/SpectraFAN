# SpectraFAN default training config.
# Mirrors the paper's reported settings for the baseline reproduction.

model:
  backbone: unet
  channels: [64, 128, 256, 512]
  bottleneck: 1024                # standard U-Net bottleneck (depth-4 encoder + 1 bottleneck stage)
  fam: complex                    # one of: complex | real | dct (Phase 1 variants land later)
  fam_conv_kind: depthwise        # one of: depthwise | depthwise_separable; locked by params calibration vs Liu et al. 2026 Table 1
  prior: none                     # one of: none | init | reg | pretrain

data:
  dataset: temimagenet  # one of: temimagenet | pdcu
  image_size: 512
  batch_size: 4

optim:
  optimizer: rmsprop
  lr: 1.0e-5
  decay: 0.99
  weight_decay: 1.0e-8
  momentum: 0.999

train:
  epochs: 200
  loss:
    ce_weight: 0.5
    dice_weight: 0.5
  seed: 0
