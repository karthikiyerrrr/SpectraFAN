[project]
name = "spectrafan"
version = "0.0.1"
description = "Frequency-domain attention for crystallographic image segmentation."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Karthik Iyer" }]
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "numpy>=1.26",
    "scipy>=1.12",
    "polars>=1.0",
    "plotly>=5.20",
    "marimo>=0.9",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "pillow>=10.0",
    "scikit-image>=0.24",
    "omegaconf>=2.3.0",
]

[project.scripts]
spectrafan-train = "spectrafan.training.train:main"
spectrafan-profile = "spectrafan.analysis.profile:main"
spectrafan-diagnose = "spectrafan.analysis.diagnose_fam:main"
spectrafan-predict = "spectrafan.analysis.predict:main"

[dependency-groups]
dev = [
    "fvcore>=0.1.5.post20221221",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spectrafan"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["spectrafan"]

[tool.ruff.lint.per-file-ignores]
# marimo notebooks: trailing bare expressions are the cell's displayed output;
# generated cell signatures inherit casing from imported names; cells are
# wrapped in functions but read as module-level so UPPER_SNAKE constants are
# idiomatic inside them.
"notebooks/*.py" = ["B018", "N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow'"
markers = [
    "slow: marks tests that require the real dataset and a finished training run (deselect with -m 'not slow')",
]
